name: cicd

on:
  push:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:${{ env.COMMIT_ID }}

    outputs:
      commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Modify values file
        shell: bash
        run: |
          echo "Updating image tag to: ${{ needs.ci.outputs.commit_id }}"

          YQ_VERSION="v4.44.3"

          curl -fL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o yq

          chmod +x yq
          sudo mv yq /usr/local/bin/yq

          yq -i '.image.tag = "${{ needs.ci.outputs.commit_id }}"' \
            charts/python-app/values.yaml

          echo "Updated values.yaml:"
          grep -A3 "^image:" charts/python-app/values.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Updates values.yaml with commit ${{ needs.ci.outputs.commit_id }}"

      - name: Install argocd
        shell: bash
        run: |
          ARGOCD_VERSION="v2.13.3"

          curl -fL \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64" \
            -o argocd

          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd

          echo "Argo CD CLI installed:"
          argocd version --client

      - name: Argo CD app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password "${{ secrets.ARGOCD_PASSWORD }}"

          argocd app sync python-app

